[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperless-ai-tagger"
version = "0.1.0"
description = "Automatically classify, tag, and title Paperless-ngx documents using the Claude CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "respx>=0.21",
]

[project.scripts]
paperless-ai-tagger = "paperless_ai_tagger.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
